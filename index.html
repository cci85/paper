<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你論了嗎</title>
<link rel="stylesheet" href="style.css?v=202611131800">
<style>html.locked body > :not(#gate) { display: none !important; }
#gate { display: none; } html.locked #gate { display: flex; position: fixed; inset: 0; align-items: center; justify-content: center; background: #f6f5f1; z-index: 999; }
#gate form { display: flex; flex-direction: column; gap: 12px; padding: 28px 32px; border: 1px solid #dcdad3; border-radius: 12px; background: #fff; min-width: 280px; font-family: system-ui, sans-serif; }
#gate input { padding: 8px 10px; font-size: 16px; border: 1px solid #dcdad3; border-radius: 8px; }
#gate button { padding: 8px 12px; font-size: 15px; border: 0; border-radius: 8px; background: #2f6f62; color: #fff; cursor: pointer; }
#gate .err { color: #a33a2c; font-size: 13px; min-height: 1em; margin: 0; }</style>
<script>   // 密碼畫面：同一瀏覽器輸入一次後記住（只存雜湊值）
  const GATE_H = "b6570112a69917abe16ec8eb053ce061c8157a4fcdab8fa7cbff9d50f570b820";
  try { if (localStorage.getItem("pr-gate") !== GATE_H) document.documentElement.classList.add("locked"); } catch { document.documentElement.classList.add("locked"); }
</script>
</head>
<body>
<div id="gate"><form id="gateform"><b>你論了嗎</b><label>請輸入密碼<br><input type="password" id="gatepw" autocomplete="current-password" autofocus></label><button type="submit">進入</button><p class="err" id="gateerr"></p></form></div>
<script>
  document.getElementById("gateform").addEventListener("submit", async e => {
    e.preventDefault();
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("cci85-pr:" + document.getElementById("gatepw").value));
    const h = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    if (h === GATE_H) { try { localStorage.setItem("pr-gate", h); } catch {} document.documentElement.classList.remove("locked"); }
    else { document.getElementById("gateerr").textContent = "密碼不正確"; document.getElementById("gatepw").select(); }
  });
</script>
<div class="newver" id="newver" hidden>你論了嗎已更新。<button type="button" id="newverbtn">重新整理，使用新版</button><small>（目前內容都已保存，不會遺失）</small></div>
<header class="top">
  <h1>你論了嗎</h1>
  <p>從左側目錄選擇正在寫的章節 → 依步驟產生 Prompt → 按「複製」貼到指定的 AI。每份研究自動存成一個研究存檔（.md），可在其他電腦開啟。換研究一律按「開啟研究」（選資料夾 → 點研究）；開始新的研究按「新研究」。</p>
  <div class="legend">
    <span><span class="tag t-nlm">NotebookLM</span>需先上傳文獻，AI 只依文獻回答</span>
    <span><span class="tag t-ai">一般 AI</span>Claude、ChatGPT、Gemini 等，不需上傳文獻</span>
  </div>
  <div class="pbar" id="pbar">
    <label class="pn">研究名稱<input type="text" id="pname" readonly tabindex="-1" placeholder="按「新研究」取名稱"></label>
    <button type="button" id="popen">開啟研究</button>
    <button type="button" id="pnew">新研究</button>
    <button type="button" id="psaveas">另存新名稱</button>
    <button type="button" id="pdl" hidden>下載存檔</button>
    <button type="button" id="presume" class="warn" hidden></button>
    <button type="button" id="pundo" class="warn" hidden></button>
    <div class="pcur" id="pcur"></div>
    <span class="pstat" id="pstat"></span>
    <div class="plist" id="plist" hidden></div>
    <input type="file" id="pupload" accept=".md,text/markdown" hidden>
  </div>
</header>

<div class="layout">
  <aside id="toc" aria-label="論文目錄"></aside>
  <div class="work">
    <section class="card" id="sechead"></section>
    <main>
      <section class="card" id="pane"></section>
      <div class="out" id="outbox">
        <div class="out-head">
          <button class="copy" id="copy">複製 Prompt</button>
          <span id="count"></span>
        </div>
        <details id="outd"><summary>展開 Prompt</summary><pre id="out"></pre></details>
        <div class="next" id="next"></div>
      </div>
    </main>
  </div>
</div>
