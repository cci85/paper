<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>論文 Prompt 產生器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>論文 Prompt 產生器</h1>
  <p>從左側目錄選擇正在寫的章節 → 依步驟產生 Prompt → 按「複製」貼到指定的 AI。欄位內容只記在這台電腦的這個瀏覽器裡。</p>
  <div class="legend">
    <span><span class="tag t-nlm">NotebookLM</span>需先上傳文獻，AI 只依文獻回答</span>
    <span><span class="tag t-ai">一般 AI</span>Claude、ChatGPT、Gemini 等，不需上傳文獻</span>
  </div>
</header>

<div class="layout">
  <aside id="toc" aria-label="論文目錄"></aside>
  <div class="work">
    <section class="card" id="sechead"></section>
    <main>
      <section class="card" id="pane"></section>
      <section class="card out">
        <div class="out-head">
          <span id="count"></span>
          <button class="copy" id="copy">複製 Prompt</button>
        </div>
        <pre id="out"></pre>
        <div class="next" id="next"></div>
      </section>
    </main>
  </div>
</div>

<!-- 一般 script（非 ES module），雙擊本機檔案開啟也能用 -->
<script src="js/prompts.js"></script>
<script src="js/prompts-new.js"></script>
<script src="js/fence.js"></script>
<script src="js/modules.js"></script>
<script src="js/diagram.js"></script>
<script src="js/app.js"></script>
</body>
</html>
