<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前置探索｜論文 Prompt 產生器</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="explore">
<nav class="toolbox-back"><a href="./">← 回首頁</a><span class="sep">｜</span><a href="./write.html">切換到「論文撰寫」</a></nav>
<header>
  <h1>前置探索</h1>
  <p>聚焦研究方向、找關鍵字、整理文獻。選分組與模組 → 填左邊 → 右邊即時產生 Prompt → 按「複製」。欄位內容只記在這台電腦的這個瀏覽器裡。</p>
</header>

<div id="groups"></div>
<nav id="modules"></nav>

<main>
  <section class="card" id="pane"></section>
  <section class="card out">
    <div class="out-head">
      <span id="count"></span>
      <button class="copy" id="copy">複製 Prompt</button>
    </div>
    <pre id="out"></pre>
    <div class="next" id="next"></div>
  </section>
</main>

<!-- 一般 script（非 ES module），雙擊本機檔案開啟也能用 -->
<script src="js/prompts.js"></script>
<script src="js/prompts-new.js"></script>
<script src="js/fence.js"></script>
<script src="js/modules.js"></script>
<script src="js/app.js"></script>
</body>
</html>
